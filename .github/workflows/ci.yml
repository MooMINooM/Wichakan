name: Wichakan CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Check curriculum and teacher coverage
        run: |
          node tests/school-readiness.cjs
          node tests/line-guardian-admin.cjs
          node tests/teacher-assignment-rows.cjs
          node tests/teacher-scores.cjs
          node tests/timetable-auto.cjs
          node tests/pp6-print-summary.cjs
          node tests/pp6-student-prefix.cjs
          node tests/pp5.cjs
          node tests/attendance-grid.cjs
          node tests/activity-assessments.cjs
          node tests/director-overview.cjs
      - name: Build
        run: npm run build
